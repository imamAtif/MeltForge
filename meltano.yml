version: 1
default_environment: dev
project_id: meltforge-demo

environments:
  - name: dev
  - name: prod

plugins:
  extractors:
    - name: tap-postgres
      variant: meltanolabs
      pip_url: meltanolabs-tap-postgres
      config:
        host: localhost
        port: 5432
        database: analytics_db
        user: db_user
      select:
        - users.*
        - orders.*
    - name: tap-csv
      variant: meltanolabs
      config:
        add_metadata_columns: 'true'
        csv_files_definition: /home/atif/Downloads
        faker_config.locale: ''
        faker_config.seed: ''
        files: ''
        flattening_enabled: ''
        flattening_max_depth: ''
        flattening_separator: ''
        stream_map_config: ''
        stream_maps: ''
      select:
        - users.*
        - orders.*
        - products.*
  loaders:
    - name: target-snowflake
      variant: meltanolabs
      pip_url: meltanolabs-target-snowflake
      config:
        account: xy12345.us-east-1
        username: DATA_LOADER
        database: ANALYTICS
        warehouse: LOADING_WH
        default_target_schema: RAW

    - name: target-jsonl
      variant: andyh1203
      config:
        destination_path: output
        do_timestamp_file: 'false'
        custom_name: ''
jobs: []
schedules: []
